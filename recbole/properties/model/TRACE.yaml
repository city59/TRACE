# TRACE default hyperparameters (Sec. 5.1 "Parameter Settings").
hidden_size: 64                 # embedding dimension d
path_temperature: 0.4           # tau      (run_TRACE.py sets the per-dataset value, Sec. 5.4)
n_path_blocks: 2                # G        (per dataset)
max_alternatives: 6             # Omega, number of non-MAP paths (per dataset)
reg_weight: 0.0001              # lambda_reg of the L2 term in Eq. (14)
target_behavior_token: '0'      # dataset token of the target behavior b* (purchase)

# Not specified in the paper; implementation defaults.
n_heads: 10                     # H attention heads per block (head size ceil(d/H))
inner_size: 256                 # feed-forward width of each path transformer block
dropout_prob: 0.1
layer_norm_eps: 1e-12
train_neg_num: 1                # |I_u^-|, uniformly sampled training negatives
candidate_chunk_size: 64        # candidates scored together (memory only)
train_micro_batch: 256          # rows per checkpointed micro-batch (memory only; one optimizer step per batch)
